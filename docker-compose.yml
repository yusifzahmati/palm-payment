services:
  postgres:
    image: postgres:16-alpine
    container_name: palm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: palm
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - palm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d palm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  palm-pgdata:
